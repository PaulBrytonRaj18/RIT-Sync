spring:
  application:
    name: ritsync-backend

  # Lets local development read secrets from ritsync-backend/.env (gitignored).
  # In containers/production, set real environment variables instead.
  config:
    import: optional:file:.env[.properties]

  # Secrets have NO defaults on purpose: the app must fail fast if they are missing.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ritsync_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: never

  # Redis is optional - comment out if not running
  # data:
  #   redis:
  #     host: localhost
  #     port: 6379
  #     timeout: 2000ms

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  # Honour X-Forwarded-* only from trusted (internal) proxies, so clients can't spoof their IP.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  encryption:
    key: ${ENCRYPTION_KEY}
  geofence:
    default-radius-meters: 100
  face:
    threshold: 0.55
  attendance:
    threshold-warning-percent: 75
    threshold-critical-percent: 65
  cors:
    # Comma-separated list of frontend origins allowed to call the API
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    # Login / register / refresh: per client IP
    auth-capacity: ${RATE_LIMIT_AUTH_PER_MIN:10}
    # Everything else: per client IP
    api-capacity: ${RATE_LIMIT_API_PER_MIN:300}

logging:
  level:
    com.ritsync: INFO
    org.springframework.security: WARN
