# In-memory database + dummy secrets so the full Spring context can boot in tests.
spring:
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:ritsync;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-secret-test-secret-test-secret-0123456789
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

app:
  encryption:
    key: test-encryption-key-32-bytes-long!!
  rate-limit:
    auth-capacity: 1000
    api-capacity: 1000
